name: Stock News Monitor

on:
  schedule:
    # Every hour, on the hour (UTC), Monday-Friday.
    - cron: '0 * * * 1-5'
    # Once a weekend: Saturday 24:00 UTC (= Sunday 00:00 UTC).
    - cron: '0 0 * * 0'
  workflow_dispatch:      # adds a manual "Run workflow" button
    inputs:
      test_email:
        description: 'Only send a test email (skip the news check)'
        type: boolean
        default: false

permissions:
  contents: write   # lets the job push the updated news.db

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news check
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python monitor.py

      - name: Commit updated database
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.db
          git diff --cached --quiet || git commit -m "Update news DB [skip ci]"
          git push
